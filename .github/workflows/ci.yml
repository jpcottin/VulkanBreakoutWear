name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install NDK 29
        run: |
          set -o pipefail  # a failed sdkmanager must fail the step, not tail
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;29.0.14206865" 2>&1 | tail -3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # ── Native tests ─────────────────────────────────────────────────────────────
  test:
    name: Native Tests (Wear OS API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Wear OS 4 and 5 images carry the android-wear tag; Wear OS 6 and
          # later are android-wear-signed. The API 36 image renders through
          # Mesa llvmpipe. The API 37 image's Mesa driver needs a virtio-gpu
          # render node, which the emulator only exposes with its
          # VirtioGpuNativeSync feature forced on (off by default on the host
          # side): without it vkCreateInstance fails whatever the -gpu mode.
          - api-level: 33
            target: android-wear
            features: ''
          - api-level: 34
            target: android-wear
            features: ''
          - api-level: 36
            target: android-wear-signed
            features: ''
          - api-level: '37.0'
            target: android-wear-signed
            features: -feature VirtioGpuNativeSync

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install NDK 29
        run: |
          set -o pipefail  # a failed sdkmanager must fail the step, not tail
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;29.0.14206865" 2>&1 | tail -3

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same reason as in the smoke job: the runner's avdmanager writes
      # target=android-0 for minor-versioned packages such as android-37.0.
      - name: Update SDK cmdline-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null
          # sdkmanager won't overwrite the preinstalled dir; it installs to latest-2.
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi
          "$SDK/cmdline-tools/latest/bin/avdmanager" list device > /dev/null

      - name: Run native tests on a Wear OS emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: wearos_large_round
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -verbose -show-kernel -debug-metrics -metrics-collection ${{ matrix.features }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew runNativeTests -PtestAbi=x86_64 --no-daemon

  # ── Host tests: the same Google Test suite, built with the host compiler ──────
  # game.cpp has no Android dependency beyond <android/log.h>, which
  # app/src/main/cpp/test/host/ stands in for. Minutes faster than the
  # emulator legs, and the first thing to fail when the game logic breaks.
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install Google Test sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtest-dev

      - name: Build and run the native tests on the host
        run: scripts/host-tests.sh

  # ── Auto Play bench: host build of game.cpp, seeded autopilot campaigns ───────
  # Deterministic (seeded runs, fixed timestep), so the win-rate floor is a
  # regression guard for the autopilot, not a flake source.
  autoplay-bench:
    name: Auto Play bench
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Play seeded campaigns on the watch
        run: scripts/autoplay-bench.sh --runs 100 --levels --campaigns --min-campaign-win 95

  # ── Smoke test: instrumented launch test + screenshot ─────────────────────────
  smoke:
    name: Smoke Test (Wear OS API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same images as the native-test matrix; see the note there.
          - api-level: '33'
            target: android-wear
            features: ''
          - api-level: '34'
            target: android-wear
            features: ''
          - api-level: '36'
            target: android-wear-signed
            features: ''
          - api-level: '37.0'
            target: android-wear-signed
            features: -feature VirtioGpuNativeSync

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install NDK 29
        run: |
          set -o pipefail  # a failed sdkmanager must fail the step, not tail
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;29.0.14206865" 2>&1 | tail -3

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner image ships an outdated avdmanager that writes target=android-0
      # for minor-versioned packages (android-37.x); the emulator clamps that to
      # API 3 and skips the Vulkan/GLDirectMem auto-enable, which previously had
      # to be worked around with -feature GLDirectMem.
      - name: Update SDK cmdline-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null
          # sdkmanager won't overwrite the preinstalled dir; it installs to latest-2.
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi
          "$SDK/cmdline-tools/latest/bin/avdmanager" list device > /dev/null

      - name: Run instrumented smoke test and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: wearos_large_round
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -verbose -show-kernel -debug-metrics -metrics-collection ${{ matrix.features }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            ./gradlew connectedAndroidTest --no-daemon
            # The screenshots were captured INSIDE the passing test (verified
            # RESUMED + first frame presented, then a round under Auto Play) to
            # /data/local/tmp/smoke/, which survives the post-test uninstall —
            # no unverified relaunch needed.
            adb pull /data/local/tmp/smoke screenshots || true
            ls -la screenshots || true
            adb logcat -d BreakoutWear:V AndroidRuntime:E *:S > logcat.txt || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results-api${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots-api${{ matrix.api-level }}
          path: screenshots/
          if-no-files-found: warn

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logcat-api${{ matrix.api-level }}
          path: logcat.txt
          if-no-files-found: warn

  # ── Preview emulator: Wear OS 7.0 (API 37.0), non-blocking ───────────────────
  # The same smoke test on the preview emulator line (the emulators/latest
  # package, separate from the stable `emulator` package that
  # android-emulator-runner installs). Its bundled QEMU drives the guest
  # through a virtio-gpu-rutabaga device, the path the API 37 image's Mesa
  # driver is built for, so this leg is the early warning for that engine.
  # continue-on-error: it is a preview, a red run here never blocks.
  smoke-preview:
    name: Smoke Test (Wear OS API 37.0, preview emulator, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install NDK 29
        run: |
          set -o pipefail  # a failed sdkmanager must fail the step, not tail
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;29.0.14206865" 2>&1 | tail -3

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same reason as in the smoke job: the runner's avdmanager writes
      # target=android-0 for minor-versioned packages such as android-37.0.
      - name: Update SDK cmdline-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi

      # The preview emulator is a canary package the Android CLI can install;
      # sdkmanager lists it too, but the CLI is the tool Google documents for it.
      - name: Install the Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the preview emulator and the Wear OS 7.0 image
        run: |
          android --version
          android sdk install --canary emulators/latest platform-tools \
            system-images/android-37.0/android-wear-signed/x86_64
          android sdk list | grep -E 'emulators/latest|android-37.0' || true
          # The runner's PATH does not carry platform-tools: adb is needed below.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # The AVD's directory is wherever this runner's avdmanager puts it (it
      # is not always $HOME/.android/avd), so ask it rather than assume.
      - name: Create the Wear OS 7.0 AVD
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AVDMANAGER="$SDK/cmdline-tools/latest/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd -n wear37 \
            -k "system-images;android-37.0;android-wear-signed;x86_64" -d wearos_large_round
          AVD_DIR="$("$AVDMANAGER" list avd 2>/dev/null | awk -F': ' '/Name: wear37/{f=1} f && /Path:/{print $2; exit}')"
          echo "AVD directory: $AVD_DIR"
          test -f "$AVD_DIR/config.ini"
          sed -i 's/^hw.gpu.enabled=no/hw.gpu.enabled=yes/' "$AVD_DIR/config.ini"
          cat "$AVD_DIR/config.ini"
          # avdmanager wrote it under ~/.config/.android/avd; the preview
          # emulator's launcher resolves ~/.android/avd. Tell it where to look,
          # and link the classic location to the same place for good measure.
          AVD_HOME="$(dirname "$AVD_DIR")"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          [ -e "$HOME/.android/avd" ] || ln -s "$AVD_HOME" "$HOME/.android/avd"
          ls -la "$HOME/.android/avd/"

      - name: Boot the preview emulator
        timeout-minutes: 15
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          EMU_DIR="$SDK/emulators/latest"
          "$EMU_DIR/emulator" -version 2>&1 | head -3 || true
          # Without -qemu-top-dir the preview launcher runs the stable
          # engine from $SDK/emulator; pointed at its own directory it runs
          # its bundled QEMU, which exposes a virtio-gpu-rutabaga device and
          # gives the API 37 image's Mesa driver the render node it needs.
          nohup "$EMU_DIR/emulator" -avd wear37 -qemu-top-dir "$EMU_DIR" -fishtank-stdout \
            -no-window -gpu auto -noaudio -no-boot-anim -no-snapshot -verbose > emulator.log 2>&1 &
          adb wait-for-device
          for _ in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          adb shell getprop sys.boot_completed | grep -q 1
          adb shell getprop ro.build.version.sdk
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global hide_error_dialogs 1 || true

      - name: Run instrumented smoke test and capture screenshots
        run: ./gradlew connectedAndroidTest --no-daemon

      - name: Collect screenshots and logs
        if: always()
        run: |
          adb pull /data/local/tmp/smoke screenshots || true
          ls -la screenshots || true
          adb logcat -d BreakoutWear:V AndroidRuntime:E MESA:E *:S > logcat.txt || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results-api37-preview
          path: app/build/outputs/androidTest-results/
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots-api37-preview
          path: screenshots/
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-api37-preview
          path: |
            logcat.txt
            emulator.log
          if-no-files-found: warn
